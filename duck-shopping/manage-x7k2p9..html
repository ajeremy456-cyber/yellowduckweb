<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小鴨代購後台｜新增商品</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --cream:#FBF7F0; --ink:#2B2620; --coral:#F0654A; --teal:#3E7C7B;
    --line:rgba(43,38,32,0.15); --card:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif; line-height:1.7;}
  .wrap{max-width:640px; margin:0 auto; padding:48px 24px 100px;}
  h1{font-size:1.6rem; margin:0 0 6px;}
  .sub{color:#6b6154; margin:0 0 32px; font-size:0.95rem;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:26px; margin-bottom:24px;}
  .panel h2{font-size:1.05rem; margin:0 0 4px;}
  .panel .hint{color:#8a8073; font-size:0.85rem; margin:0 0 18px;}
  label{display:block; font-size:0.88rem; font-weight:600; margin:14px 0 6px;}
  input, textarea, select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:0.95rem; font-family:inherit; background:#fff; color:var(--ink);
  }
  textarea{resize:vertical; min-height:70px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  button{
    margin-top:20px; width:100%; padding:13px; border:none; border-radius:7px;
    background:var(--ink); color:#fff; font-weight:600; font-size:0.98rem; cursor:pointer;
  }
  button:disabled{opacity:0.5; cursor:not-allowed;}
  button.secondary{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .status{margin-top:14px; font-size:0.88rem; padding:10px 12px; border-radius:6px; display:none;}
  .status.ok{display:block; background:#e9f5ee; color:#2f6b47;}
  .status.err{display:block; background:#fbeaea; color:#a13333;}
  .status.info{display:block; background:#eef2f6; color:#3a5570;}
  .toggle-settings{font-size:0.85rem; color:var(--teal); cursor:pointer; text-decoration:underline; margin-bottom:20px; display:inline-block;}
  #settingsPanel{display:none;}
  .list-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.9rem;}
  .list-item:last-child{border-bottom:none;}
</style>
</head>
<body>

<div class="wrap">
  <h1>小鴨代購後台</h1>
  <p class="sub">新增商品到 products.json，儲存後 GitHub Pages 需要約 1 分鐘重新部署才會顯示在前台。</p>

  <span class="toggle-settings" id="toggleSettings">⚙️ 連線設定（第一次使用請先點這裡設定）</span>

  <div class="panel" id="settingsPanel">
    <h2>GitHub 連線設定</h2>
    <p class="hint">這些設定只會存在你目前瀏覽器裡（localStorage），不會上傳。Token 請妥善保管，不要分享給別人，也不要把這個網址公開。</p>
    <label>GitHub 帳號 / 組織名稱</label>
    <input id="owner" placeholder="例如：duck-owner">
    <label>Repository 名稱</label>
    <input id="repo" placeholder="例如：my-project">
    <label>分支名稱</label>
    <input id="branch" placeholder="main" value="main">
    <label>products.json 路徑</label>
    <input id="filepath" placeholder="duck-shopping/products.json" value="duck-shopping/products.json">
    <label>Personal Access Token（需有 repo 寫入權限）</label>
    <input id="token" type="password" placeholder="ghp_xxxxxxxxxxxx">
    <button class="secondary" id="saveSettings" type="button">儲存設定</button>
    <div class="status" id="settingsStatus"></div>
  </div>

  <div class="panel">
    <h2>新增商品</h2>
    <label>商品名稱</label>
    <input id="p_name" placeholder="例如：日本藥妝面膜 3入">
    <div class="row2">
      <div>
        <label>分類</label>
        <input id="p_category" placeholder="日本" value="日本">
      </div>
      <div>
        <label>價格（新台幣）</label>
        <input id="p_price" type="number" placeholder="280">
      </div>
    </div>
    <label>商品圖片網址（選填，多張請用逗號分隔）</label>
    <input id="p_image" placeholder="https://圖片1.jpg, https://圖片2.jpg">
    <label>下單網址（選填，例如 LINE 加好友連結、表單連結）</label>
    <input id="p_orderurl" placeholder="https://line.me/ti/p/你的ID">
    <label>商品描述</label>
    <textarea id="p_desc" placeholder="簡短描述商品特色"></textarea>
    <button id="submitBtn" type="button">新增到網站</button>
    <div class="status" id="submitStatus"></div>
  </div>

  <div class="panel">
    <h2>目前商品清單</h2>
    <div id="currentList" class="hint">尚未載入，請先完成連線設定並新增一次商品，或點下方按鈕重新整理。</div>
    <button class="secondary" id="refreshBtn" type="button">重新整理清單</button>
  </div>
</div>

<script>
const els = {
  owner: document.getElementById('owner'),
  repo: document.getElementById('repo'),
  branch: document.getElementById('branch'),
  filepath: document.getElementById('filepath'),
  token: document.getElementById('token'),
};

function loadSettings(){
  const s = JSON.parse(localStorage.getItem('duck_admin_settings') || '{}');
  for(const k in els){ if(s[k]) els[k].value = s[k]; }
}
function getSettings(){
  const s = {};
  for(const k in els){ s[k] = els[k].value.trim(); }
  return s;
}
document.getElementById('saveSettings').addEventListener('click', ()=>{
  const s = getSettings();
  localStorage.setItem('duck_admin_settings', JSON.stringify(s));
  showStatus('settingsStatus', 'ok', '設定已儲存在此瀏覽器。');
});
document.getElementById('toggleSettings').addEventListener('click', ()=>{
  const p = document.getElementById('settingsPanel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
});
loadSettings();

function showStatus(id, type, msg){
  const el = document.getElementById(id);
  el.className = 'status ' + type;
  el.textContent = msg;
}

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}

async function githubApi(path, options={}){
  const s = getSettings();
  if(!s.owner || !s.repo || !s.token || !s.filepath){
    throw new Error('請先完成上方的連線設定');
  }
  const url = `https://api.github.com/repos/${s.owner}/${s.repo}/contents/${s.filepath}`;
  const res = await fetch(url, {
    ...options,
    headers: {
      'Authorization': `token ${s.token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers||{})
    }
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`GitHub API 錯誤 (${res.status})：${t.slice(0,200)}`);
  }
  return res.json();
}

async function fetchProductsFile(){
  const s = getSettings();
  const data = await githubApi(`?ref=${encodeURIComponent(s.branch||'main')}`);
  const content = base64ToUtf8(data.content);
  return { json: JSON.parse(content), sha: data.sha };
}

async function saveProductsFile(json, sha, message){
  const s = getSettings();
  const body = {
    message,
    content: utf8ToBase64(JSON.stringify(json, null, 2)),
    sha,
    branch: s.branch || 'main'
  };
  const url = `https://api.github.com/repos/${s.owner}/${s.repo}/contents/${s.filepath}`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${s.token}`,
      'Accept': 'application/vnd.github+json'
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`儲存失敗 (${res.status})：${t.slice(0,200)}`);
  }
  return res.json();
}

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('submitBtn');
  const name = document.getElementById('p_name').value.trim();
  const category = document.getElementById('p_category').value.trim() || '日本';
  const price = document.getElementById('p_price').value.trim();
  const image = document.getElementById('p_image').value.trim();
  const orderUrl = document.getElementById('p_orderurl').value.trim();
  const desc = document.getElementById('p_desc').value.trim();

  if(!name || !price){
    showStatus('submitStatus', 'err', '請至少填寫商品名稱與價格。');
    return;
  }

  btn.disabled = true;
  showStatus('submitStatus', 'info', '正在新增商品，請稍候...');

  try{
    const { json, sha } = await fetchProductsFile();
    const newProduct = {
      id: Date.now().toString(),
      name, category, price,
      images: image ? image.split(',').map(s => s.trim()).filter(Boolean) : [],
      orderUrl,
      desc
    };
    json.products = json.products || [];
    json.products.push(newProduct);

    await saveProductsFile(json, sha, `新增商品：${name}`);

    showStatus('submitStatus', 'ok', '商品已新增！約 1 分鐘後前台會更新。');
    document.getElementById('p_name').value = '';
    document.getElementById('p_price').value = '';
    document.getElementById('p_image').value = '';
    document.getElementById('p_orderurl').value = '';
    document.getElementById('p_desc').value = '';
    renderCurrentList(json.products);
  }catch(e){
    showStatus('submitStatus', 'err', e.message);
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  try{
    const { json } = await fetchProductsFile();
    renderCurrentList(json.products);
  }catch(e){
    document.getElementById('currentList').textContent = e.message;
  }
});

function renderCurrentList(products){
  const el = document.getElementById('currentList');
  if(!products || products.length===0){
    el.textContent = '目前沒有商品。';
    return;
  }
  el.innerHTML = products.map(p =>
    `<div class="list-item"><span>${p.name}（${p.category}）</span><span>NT$ ${p.price}</span></div>`
  ).join('');
}
</script>

</body>
</html>
